<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ka Ndeke – Connection Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      background: #0b1c2d;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
    }

    .status {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }

    .connected { color: #00ff9c; }
    .reachable { color: #ffaa00; }
    .error { color: #ff5555; }

    button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Ka Ndeke Backend Status</h1>
  <div id="status" class="status reachable">Checking connection…</div>

  <button onclick="checkHealth()">Recheck</button>

  <script>
    // 🔒 HARD-CODED BACKEND URL
    const BACKEND_URL = "https://ka-ndeke-backend-momo.onrender.com";

    async function checkHealth() {
      const statusEl = document.getElementById("status");
      statusEl.textContent = "Checking connection…";
      statusEl.className = "status reachable";

      try {
        const res = await fetch(BACKEND_URL + "/health", {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const data = await res.json();

        // ✅ THIS IS THE KEY FIX
        if (
          data.ok === true ||
          data.connected === true ||
          data.status === "connected"
        ) {
          statusEl.textContent = "CONNECTED";
          statusEl.className = "status connected";
        } else {
          statusEl.textContent = "REACHABLE (unexpected response)";
          statusEl.className = "status reachable";
        }

      } catch (err) {
        statusEl.textContent = "NOT CONNECTED";
        statusEl.className = "status error";
        console.error(err);
      }
    }

    // Auto-check on load
    checkHealth();
  </script>

</body>
</html>
