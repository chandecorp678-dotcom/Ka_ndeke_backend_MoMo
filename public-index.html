<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ka Ndeke – Aviator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #081a2b;
  color: #fff;
  text-align: center;
}
header {
  background: #03101f;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header h1 {
  margin: 0;
  font-size: 18px;
  color: gold;
}
button {
  padding: 8px 14px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
}
.primary { background: gold; font-weight: bold; }
.danger { background: crimson; color: #fff; }
.hidden { display: none; }

.game-box {
  background: #12345a;
  margin: 10px;
  border-radius: 10px;
  padding: 10px;
  height: 260px;
  position: relative;
  overflow: hidden;
}
#multiplier {
  font-size: 26px;
  font-weight: bold;
  position: absolute;
  top: 10px;
  left: 10px;
}
#plane {
  width: 80px;
  position: absolute;
  bottom: 20px;
  left: 10px;
  transition: transform 0.1s linear;
}
input {
  padding: 8px;
  margin: 5px;
  width: 140px;
  text-align: center;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-content {
  background: #0c223a;
  padding: 20px;
  width: 90%;
  max-width: 300px;
  border-radius: 8px;
}
.modal-content input { width: 100%; }
</style>
</head>

<body>

<header>
  <h1>✈️ Ka Ndeke</h1>
  <div>
    <button onclick="showLogin()">Login</button>
    <button onclick="showRegister()">Register</button>
    <button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
  </div>
</header>

<div>
  Logged in as: <b id="username">Guest</b><br>
  Balance: <b>ZMW <span id="balance">10.00</span></b>
</div>

<div class="game-box">
  <div id="multiplier">1.00x</div>
  <svg id="plane" viewBox="0 0 64 32">
    <path d="M4 18 C18 18 32 16 46 12 C50 11 54 9 60 8" fill="#FFD54F"/>
  </svg>
</div>

<div>
  <input type="number" id="bet" value="5" min="1"><br>
  <button class="primary" onclick="startGame()">Play</button>
  <button class="danger" onclick="cashOut()">Cash Out</button><br><br>
  <button onclick="deposit()">Deposit</button>
  <button onclick="withdraw()">Withdraw</button>
</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
  <div class="modal-content">
    <h3>Login</h3>
    <input id="loginPhone" placeholder="Phone">
    <input id="loginPassword" type="password" placeholder="Password">
    <button class="primary" onclick="login()">Submit</button>
    <button onclick="hideModals()">Cancel</button>
  </div>
</div>

<!-- REGISTER -->
<div class="modal" id="registerModal">
  <div class="modal-content">
    <h3>Register</h3>
    <input id="regName" placeholder="Full Name">
    <input id="regPhone" placeholder="Phone">
    <input id="regPassword" type="password" placeholder="Password">
    <button class="primary" onclick="register()">Submit</button>
    <button onclick="hideModals()">Cancel</button>
  </div>
</div>

<script>
const API = "https://ka-ndeke-backend-momo.onrender.com";

let user = JSON.parse(localStorage.getItem("user")) || { guest: true };
let balance = Number(localStorage.getItem("balance")) || 10;

let running=false, multiplier=1, timer, crash;

function updateUI(){
  username.textContent = user.name || "Guest";
  balanceEl.textContent = balance.toFixed(2);
  logoutBtn.classList.toggle("hidden", user.guest);
  localStorage.setItem("balance", balance);
  localStorage.setItem("user", JSON.stringify(user));
}
const balanceEl = document.getElementById("balance");
updateUI();

/* GAME */
function startGame(){
  if(running) return;
  const bet = Number(bet.value);
  if(bet>balance) return alert("Insufficient balance");
  balance -= bet; updateUI();
  running=true; multiplier=1;
  crash = Math.random()*4+1.2;
  timer=setInterval(()=>{
    multiplier+=0.02;
    multiplierEl.textContent=multiplier.toFixed(2)+"x";
    plane.style.transform=`translate(${multiplier*30}px,-${multiplier*10}px)`;
    if(multiplier>=crash) endGame(false);
  },50);
}
const multiplierEl=document.getElementById("multiplier");

function cashOut(){ if(running) endGame(true); }
function endGame(win){
  clearInterval(timer); running=false;
  if(win) balance += Number(bet.value)*multiplier;
  multiplier=1;
  plane.style.transform="translate(0,0)";
  multiplierEl.textContent="1.00x";
  updateUI();
}

/* AUTH */
function showLogin(){ loginModal.style.display="flex"; }
function showRegister(){ registerModal.style.display="flex"; }
function hideModals(){ loginModal.style.display=registerModal.style.display="none"; }

async function login(){
  try{
    const res = await fetch(API+"/auth/login",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        phone: loginPhone.value,
        phone_number: loginPhone.value,
        password: loginPassword.value
      })
    });
    const data = await res.json();
    if(!res.ok) throw data;
    user = data.user || { name:data.name };
    balance = Number(data.balance ?? 5);
    user.guest=false;
    hideModals(); updateUI();
  }catch(e){ alert(e.error||"Login failed"); }
}

async function register(){
  try{
    const res = await fetch(API+"/auth/register",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        name: regName.value,
        full_name: regName.value,
        phone: regPhone.value,
        phone_number: regPhone.value,
        password: regPassword.value
      })
    });
    const data = await res.json();
    if(!res.ok) throw data;
    user = data.user || { name: regName.value };
    balance = 5;
    user.guest=false;
    hideModals(); updateUI();
  }catch(e){ alert(e.error||"Register failed"); }
}

function logout(){
  user={ guest:true };
  balance=10;
  updateUI();
}

/* WALLET */
function deposit(){
  if(user.guest){
    balance+=10; updateUI(); return;
  }
  alert("Backend deposit hook ready");
}
function withdraw(){
  if(user.guest){
    if(balance<10) return alert("Too low");
    balance-=10; updateUI(); return;
  }
  alert("Backend withdraw hook ready");
}
</script>

</body>
</html>
